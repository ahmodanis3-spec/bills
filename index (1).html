<style>
:root{--bg:#f2f6fc;--card:#fff;--tx:#1a1d23;--mu:#6b7280;--ac:#1f6feb;--ac2:#4f9bff;--bd:#e3e6eb;--has:#e6f0ff}
[data-theme=emerald]{--bg:#f1f8f5;--ac:#0f9d6b;--ac2:#34c48e;--has:#def5ea;--bd:#d9eae2}
[data-theme=violet]{--bg:#f6f3fc;--ac:#7c4dff;--ac2:#a58bff;--has:#ece6ff;--bd:#e4def5}
[data-theme=sunset]{--bg:#fdf5ef;--ac:#f2672a;--ac2:#ffa24d;--has:#ffe9d8;--bd:#f3e2d3}
[data-theme=rose]{--bg:#fdf2f5;--ac:#e0457b;--ac2:#ff7aa5;--has:#ffe1ea;--bd:#f5dce4}
[data-theme=night]{--bg:#12141a;--card:#1c1f27;--tx:#eceef2;--mu:#9aa1ad;--ac:#5b9cff;--ac2:#8ab6ff;--bd:#2f343c;--has:#1d2f4d}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;padding:0 14px calc(20px + env(safe-area-inset-bottom,0px));max-width:680px;margin:auto;transition:background .3s}
header{margin:0 -14px 14px;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 18px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-radius:0 0 22px 22px;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-size:20px;margin:0}
.badge{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:12px;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.35);padding:3px 10px;border-radius:20px}
.hbtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.hb{background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:20px;padding:7px 13px;font-size:13px;backdrop-filter:blur(4px)}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 12px;cursor:pointer}
button:disabled{opacity:.5}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px}.nav b{font-size:17px}
.nav button{width:42px;padding:8px 0}.today{width:auto!important;padding:8px 12px!important;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.dow{text-align:center;font-size:12px;color:var(--mu)}
.day{min-height:54px;border:1px solid var(--bd);background:var(--card);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;padding:3px;transition:transform .1s}
.day:active{transform:scale(.95)}
.day.has{background:var(--has);border-color:var(--ac)}.day.sel{outline:2px solid var(--ac)}
.day.tdy{border:2px solid var(--ac2);font-weight:700}
.day small{font-size:10px;color:var(--ac);font-weight:600}.day.empty{visibility:hidden}
.panel{margin-top:16px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.panel h2{font-size:16px;margin:0 0 10px}.mu{color:var(--mu);font-size:13px}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.cat{text-align:left;padding:10px;border-radius:12px;line-height:1.3;font-size:13px}.cat.on{border-color:var(--ac);background:var(--has)}.cat small{display:block;color:var(--mu)}
.file{padding:10px 0;border-top:1px solid var(--bd)}
.frow{display:flex;align-items:center;gap:8px}.frow a{flex:1;color:var(--ac);text-decoration:none;word-break:break-all}
.sm{padding:4px 9px;font-size:13px}.del{color:#d33}
.ef{display:grid;gap:8px;margin-top:8px;padding:10px;background:var(--bg);border-radius:10px}
.ef label{font-size:12px;color:var(--mu);display:grid;gap:3px}
input,select{font:inherit;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);width:100%}
input:focus,select:focus{outline:2px solid var(--ac2);outline-offset:0}
.up{margin-top:12px;padding:12px;border:1px dashed var(--ac);border-radius:12px}
.uploadbtn{margin-top:10px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0;width:100%;padding:12px;font-weight:600}
#fileInput{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.backup{margin-top:14px}.status{margin-top:8px;min-height:20px}
.hint{font-size:12px;color:var(--mu);margin-top:14px;line-height:1.5;text-align:center}
.box{margin:0 0 12px;padding:12px;background:var(--card);border:1px solid var(--bd);border-radius:14px;display:grid;gap:8px}
.themes{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid transparent;padding:0}.sw.on{border-color:var(--tx)}

/* লগইন মডাল */
.ov{position:fixed;inset:0;background:rgba(10,14,25,.55);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}
.ov.show{display:flex;animation:fade .18s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{width:100%;max-width:380px;background:var(--card);border-radius:22px;padding:22px 20px 20px;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:pop .22s}
@keyframes pop{from{transform:translateY(14px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.modal .ico{width:54px;height:54px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;font-size:26px;background:linear-gradient(135deg,var(--ac),var(--ac2))}
.modal h3{margin:0 0 4px;text-align:center;font-size:18px}
.modal .mu.c{text-align:center;margin-bottom:14px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--bg);padding:4px;border-radius:12px;margin-bottom:14px}
.tab{border:0;background:transparent;padding:9px;border-radius:9px;font-size:14px;color:var(--mu)}
.tab.on{background:var(--card);color:var(--ac);font-weight:700;box-shadow:0 1px 5px rgba(0,0,0,.1)}
.fld{display:grid;gap:10px}
.pwwrap{position:relative}.pwwrap input{padding-right:44px}
.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;padding:6px 10px}
.lm{min-height:18px;font-size:13px;color:#d33;text-align:center}.lm.ok{color:var(--ac)}
.close{width:100%;margin-top:8px;border:0;background:none;color:var(--mu);font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:#1a1d23;color:#fff;padding:11px 18px;border-radius:24px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>

{id:"sm1",n:"Sample Distribution 1 — Authorise",h:"কাগজ নেবে, সাক্ষর অবশ্যই থাকতে হবে"},

const now=new Date();
let y=now.getFullYear(),m=now.getMonth(),sel=null,cat=null,editing=null,sb=null,isAdmin=false,isEditor=false,data={},allCache=[],deferred=null,tab="h";
const $=id=>document.getElementById(id);

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const urlOf=p=>sb.storage.from("bills").getPublicUrl(p).data.publicUrl;
const todayKey=key(now.getFullYear(),now.getMonth(),now.getDate());
let tt;function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("show"),2600);}

/* ---- থিম ---- */
function applyTheme(t){
 if(!THEMES.some(x=>x[0]===t))t="ocean";
 document.documentElement.dataset.theme=t;
 const c=getComputedStyle(document.documentElement).getPropertyValue("--ac").trim();
 $("tc").setAttribute("content",c);
 try{localStorage.setItem("theme",t);}catch(e){}
 if($("tp").innerHTML)themePanel();
}
try{applyTheme(localStorage.getItem("theme")||"ocean");}catch(e){}
async function loadTheme(){
 try{const {data:r}=await sb.from("settings").select("value").eq("key","theme").maybeSingle();if(r&&r.value)applyTheme(r.value);}catch(e){}
}
function themePanel(){
 const cur=document.documentElement.dataset.theme;
 $("tp").innerHTML='<div class="box"><b>🎨 থিম বাছুন (সবার জন্য প্রযোজ্য হবে)</b><div class="themes">'+THEMES.map(t=>`<button type="button" class="sw${cur===t[0]?" on":""}" data-t="${t[0]}" title="${t[2]}" style="background:${t[1]}"></button>`).join("")+'</div><div class="mu" id="tm"></div></div>';
 $("tp").querySelectorAll(".sw").forEach(b=>b.addEventListener("click",async()=>{
  const t=b.dataset.t;applyTheme(t);
  const {error}=await sb.from("settings").upsert({key:"theme",value:t});
  $("tm").textContent=error?"সংরক্ষণ হয়নি (শুধু আপনার ফোনে বদলেছে): "+error.message:"থিম সংরক্ষিত হয়েছে ✔";
 }));
}
$("themeBtn").addEventListener("click",()=>{if($("tp").innerHTML)$("tp").innerHTML="";else themePanel();});

/* ---- অ্যাপ ইনস্টল ---- */
const standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone;
if(standalone)$("installBtn").style.display="none";
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;});
window.addEventListener("appinstalled",()=>{$("installBtn").style.display="none";});
$("installBtn").addEventListener("click",async()=>{
 if(!/^https?:$/.test(location.protocol)){alert("আপনি অ্যাপটি ফাইল থেকে খুলেছেন, তাই ইনস্টল হবে না। Chrome-এ আপনার ওয়েবসাইটের লিংক (https://...github.io/bills/) খুলে তারপর এই বাটন চাপুন।");return;}
 if(!deferred&&!/iphone|ipad|ipod/i.test(navigator.userAgent)){for(let i=0;i<15&&!deferred;i++)await new Promise(r=>setTimeout(r,200));}
 if(deferred){deferred.prompt();await deferred.userChoice;deferred=null;return;}
 if(/iphone|ipad|ipod/i.test(navigator.userAgent))alert("iPhone-এ: Safari-র নিচের Share বাটন চাপুন, তারপর 'Add to Home Screen' চাপুন।");
 else alert("Chrome-এর উপরের ডানে তিন ডট (⋮) চাপুন, তারপর 'Add to Home screen' বা 'Install app' চাপুন।");
});
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));

/* ---- ডেটা ---- */
function refreshData(){data={};allCache.forEach(f=>(data[f.date]??=[]).push(f));}
async function reload(){
 const {data:rows,error}=await sb.from("bill_files").select("*").order("id");
 if(error){$("panel").innerHTML='<span class="mu">ডেটা লোড করা যায়নি: '+esc(error.message)+'</span>';return;}
 allCache=rows||[];refreshData();render();
}
async function roleOf(u,tok){
 if(!u)return null;
 const e=(u.email||"").toLowerCase();
 if(e===ADMIN_EMAIL.toLowerCase())return"admin";
 try{
  let r=null;
  if(tok){
   const res=await fetch(SUPABASE_URL+"/rest/v1/editors?select=email&email=eq."+encodeURIComponent(e),{headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+tok}});
   if(!res.ok){window.roleErr="HTTP "+res.status+" "+(await res.text()).slice(0,120);return null;}
   const j=await res.json();r=j[0]||null;window.roleErr="";
  }else{
   const {data,error:qe}=await sb.from("editors").select("email").eq("email",e).maybeSingle();window.roleErr=qe?qe.message:"";r=data;
  }
  if(r)return"editor";
 }catch(x){window.roleErr=x.message;}
 return null;
}
async function setAdmin(s){
 const role=await roleOf(s&&s.user,s&&s.access_token);
 isAdmin=role==="admin";isEditor=role==="editor";
 $("authBtn").textContent=role?"🚪 লগআউট":"🔒 লগইন";
 $("role").textContent=isAdmin?"🛡 অ্যাডমিন — সব অনুমতি আছে":isEditor?"👥 সহকারী — শুধু আপলোড":"👁 দেখার মোড";
 $("themeBtn").style.display=isAdmin?"":"none";
 $("edBtn").style.display=isAdmin?"":"none";
 $("pwBtn").style.display=isEditor?"":"none";
 if(role)closeLogin();
 if(!isAdmin){$("tp").innerHTML="";$("ep").innerHTML="";editing=null;}
}

async function editorsPanel(){
 const {data:rows,error}=await sb.from("editors").select("email").order("email");
 if(error){$("ep").innerHTML='<div class="box mu">লোড হয়নি: '+esc(error.message)+' (team-setup.sql চালানো হয়েছে কি?)</div>';return;}
 $("ep").innerHTML='<div class="box"><b>👥 সহকারী (শুধু আপলোড করতে পারবে; মুছতে, বদলাতে বা থিম বদলাতে পারবে না)</b>'+(rows||[]).map(r=>`<div class="frow"><span style="flex:1;word-break:break-all">${esc(showCode(r.email))}</span><button type="button" class="sm del" data-rm="${esc(r.email)}">সরান</button></div>`).join("")+'<input id="ne" type="text" placeholder="নতুন ইউজারনেম (ইংরেজি অক্ষর/সংখ্যা, যেমন rahim01)" autocomplete="off" autocapitalize="none"><input id="np" type="text" placeholder="সহকারীর পাসওয়ার্ড (কমপক্ষে ৮ অক্ষর)" autocomplete="off"><button type="button" class="uploadbtn" style="margin:0" id="adde">যোগ করুন</button><div class="mu" id="ems">প্রতিটি সহকারীর আলাদা ইউজারনেম ও পাসওয়ার্ড দিন এবং তাকে জানান। সে লগইনের পর নিজের পাসওয়ার্ড বদলে নিতে পারবে। অ্যাডমিনের Gmail/পাসওয়ার্ড সম্পূর্ণ আলাদা।</div></div>';
 $("adde").addEventListener("click",async()=>{
  const raw=$("ne").value.trim().toLowerCase().replace(/[^a-z0-9]/g,""),pw=$("np").value;
  if(raw.length<3){$("ems").textContent="ইউজারনেম কমপক্ষে ৩টি ইংরেজি অক্ষর/সংখ্যার হতে হবে।";return;}
  if(pw.length<8){$("ems").textContent="পাসওয়ার্ড কমপক্ষে ৮ অক্ষরের হতে হবে।";return;}
  const e=codeEmail(raw),btn=$("adde");btn.disabled=true;$("ems").textContent="অ্যাকাউন্ট তৈরি হচ্ছে...";
  try{
   // আলাদা ক্লায়েন্ট: অ্যাডমিনের সেশন নষ্ট হবে না
   const tmp=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
   const su=await tmp.auth.signUp({email:e,password:pw});
   if(su.error){$("ems").textContent="ব্যর্থ: "+su.error.message;return;}
   if(su.data.user&&su.data.user.identities&&su.data.user.identities.length===0){$("ems").textContent="এই ইউজারনেম আগেই ব্যবহৃত হয়েছে, অন্য ইউজারনেম দিন।";return;}
   if(!su.data.session){$("ems").textContent="Supabase-এ Confirm email বন্ধ করা নেই।";return;}
   const {error:er}=await sb.from("editors").insert({email:e});
   if(er){$("ems").textContent=/duplicate|unique/i.test(er.message)?"এই ইউজারনেম আগেই আছে, অন্য দিন।":"ব্যর্থ: "+er.message;return;}
   toast("সহকারী যোগ হয়েছে ✔");editorsPanel();
  }catch(x){$("ems").textContent="ব্যর্থ: "+x.message;}finally{btn.disabled=false;}
 });
 $("ep").querySelectorAll("[data-rm]").forEach(b=>b.addEventListener("click",async()=>{
  if(!confirm("এই সহকারীকে সরাবেন?"))return;
  await sb.from("editors").delete().eq("email",b.dataset.rm);toast("সরানো হয়েছে");editorsPanel();
 }));
}
$("pwBtn").addEventListener("click",async()=>{
 const p=prompt("নতুন পাসওয়ার্ড লিখুন (কমপক্ষে ৮ অক্ষর):");if(p===null)return;
 if(p.length<8){toast("পাসওয়ার্ড কমপক্ষে ৮ অক্ষরের হতে হবে");return;}
 const {error}=await sb.auth.updateUser({password:p});
 toast(error?"বদলানো যায়নি: "+error.message:"পাসওয়ার্ড বদলানো হয়েছে ✔");
});
$("edBtn").addEventListener("click",()=>{if($("ep").innerHTML)$("ep").innerHTML="";else editorsPanel();});

/* ---- লগইন মডাল ---- */
function setTab(t){
 tab=t;
 $("tabH").classList.toggle("on",t==="h");$("tabA").classList.toggle("on",t==="a");
 $("em").type=t==="a"?"email":"text";$("em").inputMode=t==="a"?"email":"text";$("em").placeholder=t==="a"?"অ্যাডমিন Gmail":"ইউজারনেম";
 $("lm").textContent="";$("lm").className="lm";
}
function openLogin(){$("ov").classList.add("show");setTab("h");setTimeout(()=>$("em").focus(),50);}
function closeLogin(){$("ov").classList.remove("show");$("em").value="";$("pw").value="";$("lm").textContent="";}
function msg(t,ok){$("lm").textContent=t;$("lm").className="lm"+(ok?" ok":"");}
$("tabH").addEventListener("click",()=>setTab("h"));
$("tabA").addEventListener("click",()=>setTab("a"));
$("lclose").addEventListener("click",closeLogin);
$("ov").addEventListener("click",e=>{if(e.target===$("ov"))closeLogin();});
$("eye").addEventListener("click",()=>{const p=$("pw");p.type=p.type==="password"?"text":"password";});

$("authBtn").addEventListener("click",async()=>{
 if(isAdmin||isEditor){await sb.auth.signOut();toast("লগআউট হয়েছে");return;}
 openLogin();
});

const T=(p,n)=>Promise.race([p,new Promise((_,j)=>setTimeout(()=>j(new Error(n+" — ১২ সেকেন্ডেও সাড়া পাওয়া যায়নি")),12000))]);
async function doLogin(){
 const typed=$("em").value.trim().toLowerCase(),btn=$("go");
 if(!typed){msg(tab==="a"?"Gmail লিখুন।":"ইউজারনেম লিখুন।");return;}
 const isAdm=tab==="a"&&typed===ADMIN_EMAIL.toLowerCase();
 const email=tab==="a"?typed:codeEmail(typed);
 btn.disabled=true;msg("অপেক্ষা করুন...",true);
 try{
  if(tab==="a"){
   if(!isAdm){msg("এটি অ্যাডমিনের Gmail নয়।");return;}
   if(!$("pw").value){msg("পাসওয়ার্ড লিখুন।");return;}
   const {data:d,error}=await sb.auth.signInWithPassword({email,password:$("pw").value});
   if(error){msg("লগইন ব্যর্থ: "+error.message);return;}
   if(!(await roleOf(d.user))){await sb.auth.signOut();msg("এই অ্যাকাউন্টের কোনো অনুমতি নেই।");return;}
   toast("অ্যাডমিন হিসেবে লগইন হয়েছে ✔");return;
  }
  const uname=typed.replace(/[^a-z0-9]/g,"");
  if(uname.length<3){msg("সঠিক ইউজারনেম লিখুন।");return;}
  if(!$("pw").value){msg("পাসওয়ার্ড লিখুন।");return;}
  msg("সাইন-ইন হচ্ছে...",true);
  const r=await T(sb.auth.signInWithPassword({email,password:$("pw").value}),"সাইন-ইন");
  if(r.error){msg("ইউজারনেম বা পাসওয়ার্ড ভুল।");return;}
  const tok=r.data.session&&r.data.session.access_token;
  const rl=await T(roleOf(r.data.user,tok),"অনুমতি যাচাই");
  if(!rl){await sb.auth.signOut();msg("এই অ্যাকাউন্টের অনুমতি নেই (অ্যাডমিন সরিয়ে দিয়ে থাকতে পারেন)।");return;}
  await setAdmin(r.data.session);render();closeLogin();toast("সহকারী হিসেবে লগইন হয়েছে ✔");
 }catch(e){msg("সংযোগ ব্যর্থ: "+e.message);}
 finally{btn.disabled=false;}
}
$("go").addEventListener("click",doLogin);
$("em").addEventListener("keydown",e=>{if(e.key==="Enter")doLogin();});
$("pw").addEventListener("keydown",e=>{if(e.key==="Enter")doLogin();});

/* ---- ক্যালেন্ডার ---- */
function render(){
 $("mon").textContent=MN[m]+" "+bn(y);
 const first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();let h="";
 for(let i=0;i<first;i++)h+='<div class="day empty"></div>';
 for(let d=1;d<=n;d++){const k=key(y,m,d),c=(data[k]||[]).length;h+=`<button type="button" class="day${c?" has":""}${sel===k?" sel":""}${k===todayKey?" tdy":""}" data-k="${k}">${bn(d)}${c?`<small>${bn(c)}টি</small>`:""}</button>`;}
 $("cal").innerHTML=h;
 $("cal").querySelectorAll(".day[data-k]").forEach(b=>b.addEventListener("click",()=>{sel=b.dataset.k;cat=null;editing=null;render();}));
 panelRender();
}
function editForm(f){
 return `<div class="ef"><label>তারিখ<input type="date" id="ed" value="${esc(f.date)}"></label><label>ক্যাটাগরি<select id="ec">${CATS.map(c=>`<option value="${c.id}"${c.id===f.cat?" selected":""}>${c.n}</option>`).join("")}</select></label><label>ফাইলের নাম<input id="en" value="${esc(f.name)}"></label><div style="display:flex;gap:8px"><button type="button" class="uploadbtn" style="margin:0" id="esave">সংরক্ষণ</button><button type="button" id="ecancel">বাতিল</button></div><div class="mu" id="emsg"></div></div>`;
}
function panelRender(){
 if(!sel){$("panel").innerHTML='<span class="mu">কোনো তারিখে ক্লিক করুন</span>';return;}
 const all=data[sel]||[],[Y,M,D]=sel.split("-").map(Number);
 let h=`<h2>${bn(D)} ${MN[M-1]} ${bn(Y)} — মোট ${bn(all.length)}টি ফাইল</h2><div class="cats">`;
 CATS.forEach(c=>{const n=all.filter(f=>f.cat===c.id).length;h+=`<button type="button" class="cat${cat===c.id?" on":""}" data-c="${c.id}"><b>${c.n}</b><small>${bn(n)}টি</small></button>`;});
 h+="</div>";
 if(cat){
  const C=CATS.find(x=>x.id===cat),files=all.filter(f=>f.cat===cat);
  h+=`<h2>${C.n}</h2><div class="mu">${C.h}</div>`;
  if(!files.length)h+='<div class="mu" style="padding:8px 0">এই তারিখে কোনো ফাইল নেই</div>';
  files.forEach(f=>{h+=`<div class="file"><div class="frow"><span>${f.type==="application/pdf"?"📄":"🖼️"}</span><a href="${esc(urlOf(f.path))}" target="_blank" rel="noopener">${esc(f.name)}</a>${isAdmin?`<button type="button" class="sm" data-edit="${f.id}">✏️</button><button type="button" class="sm del" data-del="${f.id}">মুছুন</button>`:""}</div>${isAdmin&&editing===f.id?editForm(f):""}</div>`;});
  if(isAdmin||isEditor)h+=`<div class="up"><div class="mu">${C.n} — PDF/ছবি আপলোড করুন</div><button type="button" class="uploadbtn" id="chooseFiles">＋ ফাইল নির্বাচন / আপলোড</button><input type="file" id="fileInput" accept="application/pdf,image/*" multiple></div><div class="mu status" id="st" aria-live="polite"></div>`;
  else h+='<div class="mu" style="margin-top:10px">👁 শুধু দেখার অনুমতি আছে।</div>';
 }
 $("panel").innerHTML=h;
 $("panel").querySelectorAll(".cat").forEach(b=>b.addEventListener("click",()=>{cat=b.dataset.c;editing=null;panelRender();}));
 $("panel").querySelectorAll("[data-edit]").forEach(b=>b.addEventListener("click",()=>{editing=Number(b.dataset.edit);panelRender();}));
 if($("ecancel"))$("ecancel").addEventListener("click",()=>{editing=null;panelRender();});
 if($("esave"))$("esave").addEventListener("click",async()=>{
  const f=allCache.find(x=>x.id===editing);if(!f)return;
  const nd=$("ed").value,nc=$("ec").value,nn=$("en").value.trim();
  if(!nd||!nn){$("emsg").textContent="তারিখ ও নাম দিন।";return;}
  $("emsg").textContent="সংরক্ষণ হচ্ছে...";
  const {data:r,error}=await sb.from("bill_files").update({date:nd,cat:nc,name:nn}).eq("id",f.id).select();
  if(error||!r||!r.length){$("emsg").textContent=error?("ব্যর্থ: "+error.message):"ব্যর্থ: আপডেট অনুমতি নেই। SQL (update-setup.sql) চালানো হয়েছে কি না দেখুন।";return;}
  editing=null;sel=nd;cat=nc;const p=nd.split("-").map(Number);y=p[0];m=p[1]-1;await reload();toast("সংরক্ষিত হয়েছে ✔");
 });
 $("panel").querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click",async()=>{
  if(!confirm("এই ফাইলটি মুছে ফেলবেন?"))return;
  const f=allCache.find(x=>String(x.id)===b.dataset.del);if(!f)return;
  const r1=await sb.storage.from("bills").remove([f.path]);
  const r2=await sb.from("bill_files").delete().eq("id",f.id);
  if(r1.error||r2.error)toast("মোছা যায়নি: "+((r1.error||r2.error).message));else toast("ফাইল মোছা হয়েছে");
  await reload();
 }));
 const choose=$("chooseFiles"),input=$("fileInput");
 if(choose&&input){
  choose.addEventListener("click",()=>input.click());
  input.addEventListener("change",async()=>{
   const files=Array.from(input.files||[]);if(!files.length)return;const st=$("st");choose.disabled=true;
   for(let i=0;i<files.length;i++){
    const file=files[i];
    if(!(file.type==="application/pdf"||file.type.startsWith("image/"))){st.textContent="সমর্থিত নয়: "+file.name;continue;}
    const ext=(file.name.split(".").pop()||"bin").replace(/[^a-zA-Z0-9]/g,"").slice(0,5)||"bin";
    const path=`${sel}/${cat}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
    st.textContent=`আপলোড হচ্ছে ${bn(i+1)}/${bn(files.length)}: ${file.name}`;
    const up=await sb.storage.from("bills").upload(path,file,{contentType:file.type});
    if(up.error){st.textContent="আপলোড ব্যর্থ: "+up.error.message;break;}
    const ins=await sb.from("bill_files").insert({date:sel,cat,name:file.name,type:file.type,path});
    if(ins.error){await sb.storage.from("bills").remove([path]);st.textContent="সংরক্ষণ ব্যর্থ: "+ins.error.message;break;}
   }
   input.value="";const msg2=$("st")?$("st").textContent:"";await reload();if($("st"))$("st").textContent=msg2.startsWith("আপলোড হচ্ছে")?"সব ফাইল আপলোড সম্পন্ন ✔":msg2;
  });
 }
}
$("dows").innerHTML=["রবি","সোম","মঙ্গল","বুধ","বৃহ","শুক্র","শনি"].map(x=>`<div class="dow">${x}</div>`).join("");
$("prev").addEventListener("click",()=>{m--;if(m<0){m=11;y--;}sel=null;cat=null;render();});
$("next").addEventListener("click",()=>{m++;if(m>11){m=0;y++;}sel=null;cat=null;render();});
$("tdy").addEventListener("click",()=>{y=now.getFullYear();m=now.getMonth();sel=todayKey;cat=null;render();});
$("bkb").addEventListener("click",async()=>{
 const status=$("bks"),btn=$("bkb");if(!window.JSZip){status.textContent="ZIP সুবিধার জন্য ইন্টারনেট চালু করুন।";return;}
 const prefix=`${y}-${String(m+1).padStart(2,"0")}-`,items=allCache.filter(f=>f.date.startsWith(prefix));
 if(!items.length){status.textContent="এই মাসে কোনো ফাইল নেই।";return;}
 btn.disabled=true;const zip=new JSZip();let count=0;
 try{
  for(const f of items){
   const r=await fetch(urlOf(f.path));if(!r.ok)throw new Error("ডাউনলোড ব্যর্থ: "+f.name);
   const folder=CATS.find(c=>c.id===f.cat)?.n||"Other";
   zip.folder(f.date).folder(folder).file(f.name,await r.blob());count++;status.textContent=`ZIP তৈরি হচ্ছে: ${bn(count)}/${bn(items.length)}`;
  }
  const blob=await zip.generateAsync({type:"blob"});const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=`bills-${prefix.slice(0,7)}.zip`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);status.textContent="ZIP ব্যাকআপ তৈরি হয়েছে।";
 }catch(e){status.textContent="ZIP তৈরি করা যায়নি: "+e.message;}finally{btn.disabled=false;}
});
(async()=>{
 if(!window.supabase){$("panel").innerHTML='<span class="mu">ইন্টারনেট সংযোগ নেই বা লাইব্রেরি লোড হয়নি।</span>';return;}
 sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
 const {data:{session}}=await sb.auth.getSession();await setAdmin(session);
 sb.auth.onAuthStateChange((_e,s)=>{setTimeout(async()=>{await setAdmin(s);render();},0);});
 loadTheme();await reload();
})();
</script>
